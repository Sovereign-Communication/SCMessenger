# WHY THIS IS PINNED, NOT "stable"
# ---------------------------------
# `channel = "stable"` let clippy's lint set change underneath a green repository.
# On 2026-10-01 the stable channel moved to rustc 1.99.0 (b940084d7 2026-09-28).
# Between 2026-09-30 and 2026-10-02 NO source commit was made to
# core/src/transport/wifi_aware.rs or core/src/transport/wifi_direct.rs, yet the
# required `Lint` check went red on 13 errors, because clippy 1.99.0 added the
# `double_must_use` lint and CI runs `cargo clippy --workspace --all-features --
# -D warnings`. PR #429 was blocked on a defect that was not in its diff.
#
# The cost of that drift was not the 13 errors, it was that the repository's
# green/red state stopped being a function of its own source. An unpinned
# channel means any future lint addition reproduces this exactly: a red repo
# with no commit to bisect and no author to ask.
#
# 1.99.0 is the exact version this repository is VERIFIED green on -- CI run
# 37061994387 at f235d49d. It is not chosen because it is newest; it is chosen
# because it is the version whose result was actually observed.
#
# `components` is declared so a clean machine gets `cargo fmt` and
# `cargo clippy` -- both repository gates -- without a manual rustup component
# add. The pinned workflows install the same two components explicitly.
#
# HOW TO BUMP (deliberately, never as a side effect)
# ---------------------------------------------------
# Change this channel AND every `dtolnay/rust-toolchain@<version>` ref in
# .github/workflows/ together, in one commit. `scripts/check_toolchain_pin.py`
# is wired into the required `Repository Hygiene Checks` context and fails the
# build if those two sources disagree, so the pin cannot rot in one place only.
# A bump is a normal PR: land it, read the CI run, and fix whatever the new
# lint set reports. That is a reviewed change instead of an ambient one.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]