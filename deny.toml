[graph]
targets = []

[output]
feature-depth = 1

[advisories]
ignore = [
    # Transitive via sled — no safe upgrade available
    "RUSTSEC-2025-0141",
    # Transitive via sled — no safe upgrade available
    "RUSTSEC-2025-0057",
    # Transitive via sled -> parking_lot — no safe upgrade available
    "RUSTSEC-2024-0384",
    # Transitive via libp2p -> if-watch -> netlink-packet-core — no safe upgrade
    "RUSTSEC-2024-0436",
    # Transitive via proc-macro-error2 — unmaintained, transitive, no fix available
    "RUSTSEC-2026-0173",
    # Transitive via zbus 4.4.0; unmaintained as standalone crates, no safe upgrade available.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # RUSTSEC-2026-0381 also flags webpki-roots 0.26.11 (patched = >=1.0.10;
    # no patched release exists in the 0.26 series). The 1.x line is bumped
    # to 1.0.10 in Cargo.lock. The 0.26 line is pulled by tokio-tungstenite
    # 0.24 (rustls 0.22) and ureq 2.x - upgrading those is a major dependency
    # upgrade, tracked separately. Transitive, no safe upgrade available.
    "RUSTSEC-2026-0381",
    # Transitive via askama 0.14 -> uniffi - unmaintained (repo archived
    # 2025-03-02), no safe upgrade available per the advisory itself.
    "RUSTSEC-2026-0374",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
