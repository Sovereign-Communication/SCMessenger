name: Linux build dependencies
description: >-
  Installs the system packages the Rust workspace needs on Linux. On
  GitHub-hosted runners this is the same apt-get call the workflows always
  made. The self-hosted OCI ARM runner uses verify-only mode by default: it
  checks required packages and toolchain components (pkg-config, libdbus-1-dev,
  protoc, rustc/clippy/rustfmt 1.99.0) and names anything missing. Ubicloud
  reports its managed runners as self-hosted, so Ubicloud callers must set
  mode: install. The OCI runner never runs sudo or apt.

inputs:
  mode:
    description: >-
      Dependency handling mode. auto preserves runner detection, install uses
      apt, and verify checks preinstalled dependencies.
    required: false
    default: "auto"
  ripgrep:
    description: "Also require ripgrep (rg). Preinstalled on GitHub-hosted runners."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install or verify Linux build dependencies
      shell: bash
      env:
        DEPENDENCY_MODE: ${{ inputs.mode }}
        NEED_RG: ${{ inputs.ripgrep }}
      run: |
        set -euo pipefail
        case "$DEPENDENCY_MODE" in
          install)
            sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler
            exit 0
            ;;
          verify)
            ;;
          auto)
            if [ "$RUNNER_ENVIRONMENT" != "self-hosted" ]; then
              sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler
              exit 0
            fi
            ;;
          *)
            echo "[FAIL] unsupported dependency mode: $DEPENDENCY_MODE"
            exit 2
            ;;
        esac
        # OCI self-hosted callers use auto/verify-only; hosted Ubicloud callers set install explicitly.
        missing=()
        pkg-config --exists dbus-1 || missing+=(libdbus-1-dev)
        command -v pkg-config >/dev/null 2>&1 || missing+=(pkg-config)
        command -v protoc >/dev/null 2>&1 || missing+=(protobuf-compiler)
        if [ "$NEED_RG" = "true" ]; then
          command -v rg >/dev/null 2>&1 || missing+=(ripgrep)
        fi
        rustc_version="$(rustc --version 2>/dev/null || true)"
        case "$rustc_version" in
          "rustc 1.99.0 "*) ;;
          *) missing+=("rustc-1.99.0") ;;
        esac
        cargo clippy --version >/dev/null 2>&1 || missing+=("clippy-1.99.0")
        cargo fmt --version >/dev/null 2>&1 || missing+=("rustfmt-1.99.0")
        if [ "${#missing[@]}" -eq 0 ]; then
          echo "[OK] self-hosted runner ($(uname -m)) has all required build dependencies (verify-only)"
          exit 0
        fi
        echo "[FAIL] self-hosted runner is missing: ${missing[*]}"
        echo "[FAIL] verify-only step: install these on the runner host; this step does not run sudo or apt"
        exit 1
