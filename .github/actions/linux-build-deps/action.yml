name: Linux build dependencies
description: >-
  Installs the system packages the Rust workspace needs on Linux. On
  GitHub-hosted runners this is the same apt-get call the workflows always
  made. On the self-hosted OCI ARM runner the packages are expected to be
  preinstalled: the step verifies them, and only installs a missing package
  when passwordless sudo is available, otherwise it fails with a message that
  names the package instead of hanging on a sudo prompt.

inputs:
  ripgrep:
    description: "Also require ripgrep (rg). Preinstalled on GitHub-hosted runners."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install or verify Linux build dependencies
      shell: bash
      env:
        NEED_RG: ${{ inputs.ripgrep }}
      run: |
        set -euo pipefail
        if [ "$RUNNER_ENVIRONMENT" != "self-hosted" ]; then
          sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
          exit 0
        fi
        missing=()
        pkg-config --exists dbus-1 || missing+=(libdbus-1-dev)
        command -v pkg-config >/dev/null 2>&1 || missing+=(pkg-config)
        if [ "$NEED_RG" = "true" ]; then
          command -v rg >/dev/null 2>&1 || missing+=(ripgrep)
        fi
        if [ "${#missing[@]}" -eq 0 ]; then
          echo "[OK] self-hosted runner ($(uname -m)) already has the required packages"
          exit 0
        fi
        echo "[INFO] self-hosted runner is missing: ${missing[*]}"
        if sudo -n true 2>/dev/null; then
          sudo -n apt-get update && sudo -n apt-get install -y "${missing[@]}"
        else
          echo "[FAIL] passwordless sudo unavailable; install on the runner: ${missing[*]}"
          exit 1
        fi
