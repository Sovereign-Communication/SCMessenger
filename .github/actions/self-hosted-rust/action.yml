name: Use preinstalled Rust (self-hosted)
description: >-
  On the self-hosted OCI ARM runner the Rust toolchain is preinstalled for the
  runner user, so the dtolnay/rust-toolchain install step is skipped there.
  This puts cargo on PATH and fails closed if the preinstalled rustc is not
  the pinned version. A no-op on GitHub-hosted runners.

inputs:
  version:
    description: "Expected rustc version"
    required: false
    default: "1.99.0"

runs:
  using: composite
  steps:
    - name: Select preinstalled Rust toolchain
      if: runner.environment == 'self-hosted'
      shell: bash
      env:
        WANT: ${{ inputs.version }}
      run: |
        set -euo pipefail
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.cargo/bin:$PATH"
        echo "arch: $(uname -m)"
        got="$(rustc --version)"
        echo "$got"
        case "$got" in
          "rustc $WANT "*) ;;
          *) echo "[FAIL] preinstalled rustc is not the pinned $WANT"; exit 1 ;;
        esac
        cargo fmt --version
        cargo clippy --version
