name: Mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'iOS/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/build_xcframework.sh'
      - 'scripts/check_wiring.py'
      - 'scripts/test_check_wiring.py'
      - 'core/src/api.udl'
      - 'mobile/**'
  pull_request:
    paths:
      - 'android/**'
      - 'iOS/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/build_xcframework.sh'
      - 'scripts/check_wiring.py'
      - 'scripts/test_check_wiring.py'
      - 'core/src/api.udl'
      - 'mobile/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  wiring-gate:
    name: Android Wiring Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run wiring gate unit tests
        run: python scripts/test_check_wiring.py
      - name: Run Android wiring & reachability gate
        run: python scripts/check_wiring.py

  # WHY THIS IS A SEPARATE JOB FROM "Android Debug APK"
  # -----------------------------------------------------
  # JVM unit tests (testDebugUnitTest) do not need the Android NDK, Rust
  # toolchain, or cargo-ndk -- those are only required for the native
  # assembleDebug step that compiles the Rust core via JNI. Running unit
  # tests in the heavy job means a slow or failing native build blocks
  # test feedback, and the native build is not triggered on PRs that
  # touch only Kotlin. A standalone JVM job gives sub-3-minute test
  # feedback on every pull_request and runs even when the APK build is
  # skipped. This also satisfies .claude/rules/android.md which requires
  # RoleNavigationPolicyTest as a pre-merge gate -- docker-test-suite.yml
  # triggers only on push to main / cron / workflow_dispatch, NOT on
  # pull_request, so it cannot serve as the PR gate on its own.
  android-unit-tests:
    name: Android JVM Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install host Rust dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Run JVM unit tests
        working-directory: android
        # Keep Android's native cross-build out of this gate, but allow the
        # host-only UniFFI generator to provide the Kotlin API sources used by
        # KSP. Native coverage remains enforced by the APK and Cross ABI jobs.
        run: >-
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
          -x buildRustAndroid

  android:
    name: Android Debug APK
    runs-on: ubuntu-latest
    # The PR mobile gate is the installable APK build. JVM unit tests run in
    # the dedicated Docker Integration Suite, where the native/JNA test
    # environment is available and its diagnostics are preserved. Running the
    # same test task here after a cold multi-ABI build has repeatedly hung for
    # ~50 minutes and exited 1 without producing a usable APK artifact.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-build
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Android APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          # Provenance stamp: android/app/build.gradle reads SCM_GIT_HASH and
          # embeds it as BuildConfig.SCM_GIT_HASH (same pattern as release.yml).
          # Without this the CI APK ships with an empty/unknown stamp and the
          # provenance chain (APK -> commit -> audit) breaks.
          SCM_GIT_HASH: ${{ github.sha }}
          SCM_GIT_REF: ${{ github.ref_name }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      # Both APK-producing lanes share one signing rule (see
      # .github/actions/sign-debug-apk). Without a pinned identity each runner
      # generates its own ~/.android/debug.keystore, so consecutive runs emit
      # different certificates and `adb install -r` over a previous install
      # fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
      - name: Sign debug APK with the pinned identity
        uses: ./.github/actions/sign-debug-apk
        with:
          apk-path: android/app/build/outputs/apk/debug/app-debug.apk
          keystore-base64: ${{ secrets.SCMESSENGER_DEBUG_KEYSTORE_BASE64 }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify APK contains core native libraries
        run: |
          python scripts/test_verify_apk_native_libs.py
          python scripts/verify_apk_native_libs.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/

      # WHY CI COMPILES THE INSTRUMENTED TESTS WITHOUT RUNNING THEM
      # -----------------------------------------------------------
      # Nothing in CI ever built android/app/src/androidTest, so guards there
      # rotted unobserved: one asserted nothing while documenting a superseded
      # ordering contract, and its replacement asserted a two-element list over
      # a three-row conversation, i.e. it could not pass on any device. Neither
      # is visible to :app:testDebugUnitTest (a different source set), which is
      # why review found them and CI could not.
      #
      # assembleDebugAndroidTest compiles and packages the test APK -- so it
      # also catches manifest/resource merge errors -- but starts no emulator
      # and runs no test. A compile gate, not a runner. Kept last so a
      # test-compile failure cannot withhold this job's installable APK.
      #
      # If it ever reds with a Kotlin daemon or JVM memory error (one local
      # report exists: HANDOFF/done/P0_BUILD_005_Android_Test_Config_Audit.md),
      # narrow it to :app:compileDebugAndroidTestKotlin -- do not delete it.
      - name: Compile instrumented tests (no device)
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          SCM_GIT_HASH: ${{ github.sha }}
          SCM_GIT_REF: ${{ github.ref_name }}
        run: ./gradlew :app:assembleDebugAndroidTest --no-daemon --stacktrace

  ios:
    name: iOS Build
    runs-on: macos-latest
    # WHY THE STEPS ARE GATED AND THE JOB IS NOT
    # -----------------------------------------
    # This workflow triggers on the union of the Android and iOS path sets,
    # because it owns jobs for both platforms, so an Android-only diff starts
    # this macOS job. The job is kept so its check still reports -- a skipped
    # check is not a passed one, and T12 section 3 records what that costs --
    # while its expensive steps are short-circuited by detect-platform-change,
    # which fails open: an uncomputable or unrecognised diff runs the build.
    steps:
      - uses: actions/checkout@v7

      - name: Detect platform-relevant change
        id: platform
        uses: ./.github/actions/detect-platform-change

      - uses: dtolnay/rust-toolchain@stable
        if: steps.platform.outputs.ios_relevant == 'true'
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        if: steps.platform.outputs.ios_relevant == 'true'
        with:
          key: ios-build
      - name: Build XCFramework and Swift bindings
        if: steps.platform.outputs.ios_relevant == 'true'
        run: |
          chmod +x scripts/build_xcframework.sh
          scripts/build_xcframework.sh
      - name: Build Xcode project
        if: steps.platform.outputs.ios_relevant == 'true'
        working-directory: iOS
        run: |
          xcodebuild build \
            -project SCMessenger/SCMessenger.xcodeproj \
            -scheme SCMessenger \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO
