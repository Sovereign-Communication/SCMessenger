name: Mobile

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'iOS/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/build_xcframework.sh'
      - 'core/src/api.udl'
      - 'mobile/**'
  pull_request:
    paths:
      - 'android/**'
      - 'iOS/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/build_xcframework.sh'
      - 'core/src/api.udl'
      - 'mobile/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android Debug APK
    runs-on: ubuntu-latest
    # The PR mobile gate is the installable APK build. JVM unit tests run in
    # the dedicated Docker Integration Suite, where the native/JNA test
    # environment is available and its diagnostics are preserved. Running the
    # same test task here after a cold multi-ABI build has repeatedly hung for
    # ~50 minutes and exited 1 without producing a usable APK artifact.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-build
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Android APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/

  ios:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-build
      - name: Build XCFramework and Swift bindings
        run: |
          chmod +x scripts/build_xcframework.sh
          scripts/build_xcframework.sh
      - name: Build Xcode project
        working-directory: iOS
        run: |
          xcodebuild build \
            -project SCMessenger/SCMessenger.xcodeproj \
            -scheme SCMessenger \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO
