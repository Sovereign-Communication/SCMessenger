# cargo-dist release builds (new — existing release process untouched until used).
# Release policy: the three-node gate (issue #603) is the trigger for any publish.
# This workflow only BUILDS artifacts; it does not publish releases.
name: Dist

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan release builds
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
      - name: Install cargo-dist
        run: cargo install cargo-dist --version 0.28.0 --locked
      - name: Plan
        id: plan
        run: |
          cargo dist plan --output-format=json > dist-manifest.json
          echo "manifest=$(cat dist-manifest.json)" >> $GITHUB_OUTPUT

  build:
    name: Build release artifacts
    needs: plan
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    runs-on: ${{ contains(matrix.target, 'apple-darwin') && 'macos-latest' || contains(matrix.target, 'windows') && 'windows-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-dist
        run: cargo install cargo-dist --version 0.28.0 --locked
      - name: Build
        run: cargo dist build --target ${{ matrix.target }} --output-format=json
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: target/distrib/
