name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      git_branch:
        description: "Branch that must resolve to candidate_sha"
        required: true
        type: string
      candidate_sha:
        description: "Full lowercase commit SHA to verify and test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect docs-only change
        id: docs_only
        uses: ./.github/actions/detect-docs-only
      - uses: dtolnay/rust-toolchain@stable
        if: steps.docs_only.outputs.is_docs_only != 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.docs_only.outputs.is_docs_only != 'true'
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
        if: steps.docs_only.outputs.is_docs_only != 'true'
      - run: cargo fmt --check
        if: steps.docs_only.outputs.is_docs_only != 'true'
      - run: cargo clippy --workspace --all-features -- -D warnings
        if: steps.docs_only.outputs.is_docs_only != 'true'
      # Pin version + lockfile: an unpinned install re-resolves transitive
      # deps against the live index, and tinyvec 1.13.0 fails to compile on
      # the runner toolchain, killing the Lint gate (tinyvec 1.11.0 in
      # cargo-deny 0.20.2's shipped Cargo.lock is known-good).
      - run: cargo install cargo-deny --version 0.20.2 --locked
        if: steps.docs_only.outputs.is_docs_only != 'true'
      - run: cargo deny check
        if: steps.docs_only.outputs.is_docs_only != 'true'

  orchestration:
    name: Orchestration control plane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Verify dispatched branch and candidate identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GIT_BRANCH: ${{ inputs.git_branch }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "[ERROR] candidate_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          branch_sha="$(git ls-remote origin "refs/heads/$GIT_BRANCH" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$branch_sha" || "$branch_sha" != "$CANDIDATE_SHA" ]]; then
            echo "[ERROR] dispatch branch does not resolve to candidate_sha" >&2
            printf '[ERROR] branch=%s branch_sha=%s candidate_sha=%s\n' "$GIT_BRANCH" "$branch_sha" "$CANDIDATE_SHA" >&2
            exit 1
          fi
          if [[ "$WORKFLOW_SHA" != "$CANDIDATE_SHA" ]]; then
            echo "[ERROR] workflow source SHA does not match candidate_sha" >&2
            printf '[ERROR] workflow_sha=%s candidate_sha=%s\n' "$WORKFLOW_SHA" "$CANDIDATE_SHA" >&2
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$CANDIDATE_SHA" ]]; then
            echo "[ERROR] checked-out SHA does not match candidate_sha" >&2
            printf '[ERROR] checked_out_sha=%s candidate_sha=%s\n' "$checked_out_sha" "$CANDIDATE_SHA" >&2
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate orchestration contract
        run: python scripts/orchestration_contract.py
      - name: Run deterministic orchestration tests
        run: python scripts/test_orchestration_v2.py

  test:
    name: Test (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Detect docs-only change
        id: docs_only
        uses: ./.github/actions/detect-docs-only
      # Non-ubuntu legs additionally need Rust-relevant input: macos-latest and
      # windows-latest run the same Rust workspace tests, and a diff that changes
      # no Rust input cannot change what they compile. ubuntu-latest is the
      # required context and keeps its existing condition exactly -- the
      # 'matrix.os == ubuntu-latest' disjunct below short-circuits the new clause
      # for that leg, so nothing about the required check changes.
      - name: Detect platform-relevant change
        id: platform
        uses: ./.github/actions/detect-platform-change
      - uses: dtolnay/rust-toolchain@stable
        if: steps.docs_only.outputs.is_docs_only != 'true' && (matrix.os == 'ubuntu-latest' || steps.platform.outputs.rust_relevant == 'true')
      - uses: Swatinem/rust-cache@v2
        if: steps.docs_only.outputs.is_docs_only != 'true' && (matrix.os == 'ubuntu-latest' || steps.platform.outputs.rust_relevant == 'true')
      - name: Install libdbus-1-dev (Ubuntu)
        if: matrix.os == 'ubuntu-latest' && steps.docs_only.outputs.is_docs_only != 'true'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Only Windows runners lack a preinstalled/vendored protoc; matches the
      # manual cross-platform-test.yml dispatch workflow's test-windows job.
      - name: Install protoc (Windows)
        if: matrix.os == 'windows-latest' && steps.docs_only.outputs.is_docs_only != 'true' && steps.platform.outputs.rust_relevant == 'true'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Several workspace integration tests intentionally bind fixed localhost
      # ports. Windows runners expose the resulting parallel-test collision
      # more readily, so keep only this platform's workspace test process
      # serialized while retaining normal parallelism on Unix runners.
      - name: Run workspace tests (Windows serialized)
        if: matrix.os == 'windows-latest' && steps.docs_only.outputs.is_docs_only != 'true' && steps.platform.outputs.rust_relevant == 'true'
        run: cargo test --workspace --features test-utils -- --test-threads=1
      - name: Run workspace tests
        if: matrix.os != 'windows-latest' && steps.docs_only.outputs.is_docs_only != 'true' && (matrix.os == 'ubuntu-latest' || steps.platform.outputs.rust_relevant == 'true')
        run: cargo test --workspace --features test-utils

  docs:
    name: Docs
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # One owner decides: the platform gate subsumes the docs-only gate, because
      # a docs-only diff reports every platform flag false (lint.yml's rust job
      # relies on the same equivalence). This job's work is pure Rust tooling, so
      # rust_relevant is its input.
      - name: Detect platform-relevant change
        id: platform
        uses: ./.github/actions/detect-platform-change
      - uses: dtolnay/rust-toolchain@stable
        if: steps.platform.outputs.rust_relevant == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.platform.outputs.rust_relevant == 'true'
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
        if: steps.platform.outputs.rust_relevant == 'true'
      - run: cargo doc --workspace --no-deps
        if: steps.platform.outputs.rust_relevant == 'true'

  ffi-surface:
    name: FFI Surface Contract
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # One owner decides: the platform gate subsumes the docs-only gate, because
      # a docs-only diff reports every platform flag false (lint.yml's rust job
      # relies on the same equivalence). This job's work is pure Rust tooling, so
      # rust_relevant is its input.
      - name: Detect platform-relevant change
        id: platform
        uses: ./.github/actions/detect-platform-change
      - uses: dtolnay/rust-toolchain@stable
        if: steps.platform.outputs.rust_relevant == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.platform.outputs.rust_relevant == 'true'
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
        if: steps.platform.outputs.rust_relevant == 'true'
      # gen_kotlin/gen_swift locate the compiled cdylib by filesystem path at
      # runtime rather than through a Cargo dependency edge, so `cargo run`
      # alone doesn't guarantee it's been built (verified: deleting the
      # cdylib and re-running `cargo run --bin gen_kotlin` reproduces the
      # "cdylib not found" panic even though nothing else changed).
      - run: cargo build -p scmessenger-core --features gen-bindings
        if: steps.platform.outputs.rust_relevant == 'true'
      - run: cargo run -p scmessenger-core --bin gen_kotlin --features gen-bindings
        if: steps.platform.outputs.rust_relevant == 'true'
      - run: cargo run -p scmessenger-core --bin gen_swift --features gen-bindings
        if: steps.platform.outputs.rust_relevant == 'true'
      - run: scripts/ffi_surface.sh
        if: steps.platform.outputs.rust_relevant == 'true'

  windows-cli-artifact:
    name: Windows CLI Artifact
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # One owner decides: the platform gate subsumes the docs-only gate, because
      # a docs-only diff reports every platform flag false (lint.yml's rust job
      # relies on the same equivalence). This job's work is pure Rust tooling, so
      # rust_relevant is its input.
      - name: Detect platform-relevant change
        id: platform
        uses: ./.github/actions/detect-platform-change
      - uses: dtolnay/rust-toolchain@stable
        if: steps.platform.outputs.rust_relevant == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.platform.outputs.rust_relevant == 'true'
      # Same protoc setup as the Test job's windows-latest leg: only Windows
      # runners lack a preinstalled/vendored protoc.
      - name: Install protoc (Windows)
        if: steps.platform.outputs.rust_relevant == 'true'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release CLI binary
        if: steps.platform.outputs.rust_relevant == 'true'
        run: cargo build -p scmessenger-cli --release
      # clap serves --version at arg-parse time, before any runtime or network
      # startup, so running the freshly built exe here is cheap and safe.
      - name: Write build provenance
        if: steps.platform.outputs.rust_relevant == 'true'
        timeout-minutes: 5
        run: |
          $sha = git rev-parse HEAD
          $ver = & .\target\release\scmessenger-cli.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "git-sha: $sha", "cli-version: $ver" | Set-Content .\target\release\cli-provenance.txt
      - name: Upload CLI artifact
        if: steps.platform.outputs.rust_relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-cli-${{ github.sha }}
          path: |
            target/release/scmessenger-cli.exe
            target/release/cli-provenance.txt
          retention-days: 30
