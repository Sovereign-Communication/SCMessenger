name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-features -- -D warnings
      - run: cargo install cargo-deny
      - run: cargo deny check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libdbus-1-dev (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Only Windows runners lack a preinstalled/vendored protoc; matches the
      # manual cross-platform-test.yml dispatch workflow's test-windows job.
      - name: Install protoc (Windows)
        if: matrix.os == 'windows-latest'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Several workspace integration tests intentionally bind fixed localhost
      # ports. Windows runners expose the resulting parallel-test collision
      # more readily, so keep only this platform's workspace test process
      # serialized while retaining normal parallelism on Unix runners.
      - name: Run workspace tests (Windows serialized)
        if: matrix.os == 'windows-latest'
        run: cargo test --workspace --features test-utils -- --test-threads=1
      - name: Run workspace tests
        if: matrix.os != 'windows-latest'
        run: cargo test --workspace --features test-utils

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo doc --workspace --no-deps

  ffi-surface:
    name: FFI Surface Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # gen_kotlin/gen_swift locate the compiled cdylib by filesystem path at
      # runtime rather than through a Cargo dependency edge, so `cargo run`
      # alone doesn't guarantee it's been built (verified: deleting the
      # cdylib and re-running `cargo run --bin gen_kotlin` reproduces the
      # "cdylib not found" panic even though nothing else changed).
      - run: cargo build -p scmessenger-core --features gen-bindings
      - run: cargo run -p scmessenger-core --bin gen_kotlin --features gen-bindings
      - run: cargo run -p scmessenger-core --bin gen_swift --features gen-bindings
      - run: scripts/ffi_surface.sh

  windows-cli-artifact:
    name: Windows CLI Artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same protoc setup as the Test job's windows-latest leg: only Windows
      # runners lack a preinstalled/vendored protoc.
      - name: Install protoc (Windows)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release CLI binary
        run: cargo build -p scmessenger-cli --release
      # clap serves --version at arg-parse time, before any runtime or network
      # startup, so running the freshly built exe here is cheap and safe.
      - name: Write build provenance
        timeout-minutes: 5
        run: |
          $sha = git rev-parse HEAD
          $ver = & .\target\release\scmessenger-cli.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "git-sha: $sha", "cli-version: $ver" | Set-Content .\target\release\cli-provenance.txt
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-cli-${{ github.sha }}
          path: |
            target/release/scmessenger-cli.exe
            target/release/cli-provenance.txt
          retention-days: 30
