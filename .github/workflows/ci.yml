name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # One cheap classification for the whole workflow. Required jobs below keep
  # starting on every run (so their check always reports) and gate their STEPS on
  # these outputs; optional macOS/Windows/doc/FFI work is gated at job level so a
  # runner is never acquired just to learn it has nothing to do.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust_relevant: ${{ steps.platform.outputs.rust_relevant }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect platform-relevant change
        id: platform
        uses: ./.github/actions/detect-platform-change

  handoff-scope:
    name: Handoff ownership scope
    # Python/git only (about 10s of work): hosted. OCI queue waits for this job reached 2 hours.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate changed handoffs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "handoff-scope: no comparison commit; refusing to skip the gate" >&2
            exit 2
          fi
          python scripts/validate_handoff_scope.py --repo-root . --changed-from "$base"
      - name: Classify the gate itself
        # The classification decides which documents are enforced at all, so a
        # silent regression here is invisible from the outside: a gate that
        # stops checking things looks exactly like a gate with nothing to
        # check. This runs on every PR and every push, needs no repository
        # state, and fails if the classifier drifts.
        shell: bash
        run: python scripts/validate_handoff_scope.py --repo-root . --self-test
      - name: Clean self-hosted workspace
        if: always()
        uses: ./.github/actions/self-hosted-cleanup

  naming-policy:
    name: Naming policy
    # Python/git only (about 10s of work): hosted. OCI queue waits for this job reached 2 hours.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce naming policy on added lines
        # The ratchet: only lines this change ADDS are judged, so the gate is
        # green on day one and gets harder to loosen, and the pre-existing
        # violations the audit counted stay the audit's backlog rather than
        # becoming a reason to skip the gate.
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "naming-policy: no comparison commit; refusing to skip the gate" >&2
            exit 2
          fi
          python scripts/check_naming.py --repo-root . --changed-from "$base"
      - name: Prove the gate can still fail
        # A gate that stops denying anything looks exactly like a gate with
        # nothing to deny. These cases run on every PR and every push, need
        # no repository state, and fail if the matcher or the policy
        # validation drifts -- including if someone edits the policy into a
        # shape where an unratified proposal can block a merge.
        shell: bash
        run: python scripts/check_naming.py --repo-root . --self-test
      - name: Clean self-hosted workspace
        if: always()
        uses: ./.github/actions/self-hosted-cleanup

  # Canonical clippy + cargo-deny gate. lint.yml's "Rust Linting" no longer repeats
  # clippy (this --all-features run is a strict superset) or compiles anything.
  # fmt also lives only in "Rust Linting". Hosted: OCI queue waits for this job
  # were 1-2 hours, and rust-cache restores main's cache on hosted runners.
  lint:
    name: Lint
    needs: changes
    # Required check: always run so it reports a real result; a failed `changes`
    # job must fail this check, not skip it (a skipped required check is green).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fail closed if change detection failed
        if: needs.changes.result != 'success'
        run: |
          echo "[FAIL] changes job result: ${{ needs.changes.result }}"
          exit 1
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
        if: needs.changes.outputs.rust_relevant == 'true'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust_relevant == 'true'
        with:
          key: lint-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux build dependencies
        if: needs.changes.outputs.rust_relevant == 'true'
        uses: ./.github/actions/linux-build-deps
      - run: cargo clippy --workspace --all-features -- -D warnings -A clippy::empty_line_after_doc_comments
        if: needs.changes.outputs.rust_relevant == 'true'
      # Pin version + lockfile: an unpinned install re-resolves transitive
      # deps against the live index, and tinyvec 1.13.0 fails to compile on
      # the runner toolchain, killing the Lint gate (tinyvec 1.11.0 in
      # cargo-deny 0.20.2's shipped Cargo.lock is known-good). rust-cache
      # restores ~/.cargo/bin, so a cached cargo-deny is reused.
      - name: Install cargo-deny 0.20.2
        if: needs.changes.outputs.rust_relevant == 'true'
        run: |
          if cargo deny --version 2>/dev/null | grep -q '0\.20\.2'; then
            echo "[OK] cargo-deny 0.20.2 already installed"
          else
            cargo install cargo-deny --version 0.20.2 --locked
          fi
      - run: cargo deny check
        if: needs.changes.outputs.rust_relevant == 'true'
  orchestration:
    name: Orchestration control plane
    # Python only (about 10s of work): hosted. OCI queue waits for this job reached 2 hours.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Runs on every pull request and every push, on the default merge checkout.
      # The manual exact-SHA variant of this gate is a SEPARATE workflow
      # (orchestration-dispatch.yml): this file hosts required status contexts and
      # must not gain a workflow_dispatch trigger.
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate orchestration contract
        run: python scripts/orchestration_contract.py
      - name: Run deterministic orchestration tests
        run: python scripts/test_orchestration_v2.py
      - name: Clean self-hosted workspace
        if: always()
        uses: ./.github/actions/self-hosted-cleanup

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    # Static matrix so 'Test (ubuntu-latest)' is statically resolvable. The
    # ubuntu leg always runs (required); macOS/Windows legs run only when the
    # diff can change the Rust workspace.
    # matrix.* is not available at job level; non-ubuntu legs are gated per step.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is the required context and always starts, so it always
        # reports. The macOS (10x billing) and Windows (2x) legs are only
        # scheduled when the diff can change the Rust workspace.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Fail closed if change detection failed
        if: needs.changes.result != 'success' && matrix.os == 'ubuntu-latest'
        run: |
          echo "[FAIL] changes job result: ${{ needs.changes.result }}"
          exit 1
      - uses: actions/checkout@v7
        if: matrix.os == 'ubuntu-latest' || needs.changes.outputs.rust_relevant == 'true'
      - uses: dtolnay/rust-toolchain@1.120.0
        if: needs.changes.outputs.rust_relevant == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust_relevant == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install libdbus-1-dev (Ubuntu)
        if: matrix.os == 'ubuntu-latest' && needs.changes.outputs.rust_relevant == 'true'
        uses: ./.github/actions/linux-build-deps
      # Only Windows runners lack a preinstalled/vendored protoc.
      - name: Install protoc (Windows)
        if: matrix.os == 'windows-latest' && needs.changes.outputs.rust_relevant == 'true'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Several workspace integration tests intentionally bind fixed localhost
      # ports. Windows runners expose the resulting parallel-test collision
      # more readily, so keep only this platform's workspace test process
      # serialized while retaining normal parallelism on Unix runners.
      - name: Run workspace tests (Windows serialized)
        if: matrix.os == 'windows-latest' && needs.changes.outputs.rust_relevant == 'true'
        run: cargo test --workspace --features test-utils -- --test-threads=1
      - name: Run workspace tests
        if: matrix.os != 'windows-latest' && needs.changes.outputs.rust_relevant == 'true'
        run: cargo test --workspace --features test-utils

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.rust_relevant == 'true'
    runs-on: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.USE_OCI_RUNNER != 'false' && fromJSON('["self-hosted","oci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Use preinstalled Rust (self-hosted)
        uses: ./.github/actions/self-hosted-rust
      - uses: dtolnay/rust-toolchain@1.120.0
        if: runner.environment != 'self-hosted'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux build dependencies
        uses: ./.github/actions/linux-build-deps
      - run: cargo doc --workspace --no-deps
      - name: Clean self-hosted workspace
        if: always()
        uses: ./.github/actions/self-hosted-cleanup

  ffi-surface:
    name: FFI Surface Contract
    needs: changes
    if: needs.changes.outputs.rust_relevant == 'true'
    runs-on: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.USE_OCI_RUNNER != 'false' && fromJSON('["self-hosted","oci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Use preinstalled Rust (self-hosted)
        uses: ./.github/actions/self-hosted-rust
      - uses: dtolnay/rust-toolchain@1.120.0
        if: runner.environment != 'self-hosted'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux build dependencies
        uses: ./.github/actions/linux-build-deps
      # gen_kotlin/gen_swift locate the compiled cdylib by filesystem path at
      # runtime rather than through a Cargo dependency edge, so `cargo run`
      # alone doesn't guarantee it's been built (verified: deleting the
      # cdylib and re-running `cargo run --bin gen_kotlin` reproduces the
      # "cdylib not found" panic even though nothing else changed).
      - run: cargo build -p scmessenger-core --features gen-bindings
      - run: cargo run -p scmessenger-core --bin gen_kotlin --features gen-bindings
      - run: cargo run -p scmessenger-core --bin gen_swift --features gen-bindings
      - run: scripts/ffi_surface.sh
      - name: Clean self-hosted workspace
        if: always()
        uses: ./.github/actions/self-hosted-cleanup

  windows-cli-artifact:
    name: Windows CLI Artifact
    needs: changes
    if: needs.changes.outputs.rust_relevant == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Same protoc setup as the Test job's windows-latest leg: only Windows
      # runners lack a preinstalled/vendored protoc.
      - name: Install protoc (Windows)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release CLI binary
        run: cargo build -p scmessenger-cli --release
      # clap serves --version at arg-parse time, before any runtime or network
      # startup, so running the freshly built exe here is cheap and safe.
      - name: Write build provenance
        timeout-minutes: 5
        run: |
          $sha = git rev-parse HEAD
          $ver = & .\target\release\scmessenger-cli.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "git-sha: $sha", "cli-version: $ver" | Set-Content .\target\release\cli-provenance.txt
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-cli-${{ github.sha }}
          path: |
            target/release/scmessenger-cli.exe
            target/release/cli-provenance.txt
          retention-days: 30
