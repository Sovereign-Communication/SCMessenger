name: Auto Tag Release

# MANUAL-ONLY since the v0.4.0 terminal release (operator directive
# 2026-07-28, per PR #115 section 1.5). The previous automatic trigger
# (push to main touching Cargo.toml) armed a trap: merging the
# 0.3.5 -> 0.4.0 bump would have pushed a STABLE v0.4.0 tag, and
# release.yml (tags: v*) would have cut a NON-prerelease GitHub Release
# at the bump commit -- not the reviewed candidate the operator tags as
# v0.4.0-alpha.1. Tags are now cut deliberately: run this workflow
# manually (Actions -> Auto Tag Release -> Run workflow) AFTER the
# terminal release PR lands. It tags whatever [workspace.package]
# version currently says; the exists-check guard below is unchanged.
# The old automatic trigger is retained commented-out for reversibility.
#
# Historical context (why auto-tagging existed): v0.2.1 (2026-03-18) sat
# as the latest tag through four version bumps with zero releases.

on:
  workflow_dispatch:
    inputs:
      dispatch_release:
        description: Start the Multi-Platform Release Pipeline for the new tag
        required: false
        type: boolean
        default: true
  # push:
  #   branches: [main]
  #   paths:
  #     - 'Cargo.toml'

permissions:
  contents: write
  actions: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract workspace version
        id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from Cargo.toml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push release tag
        id: create_tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Tagged and pushed v${{ steps.version.outputs.version }}."

      # WHY THIS STEP EXISTS
      # --------------------
      # The tag push above CANNOT start release.yml, and never could. A push made
      # with GITHUB_TOKEN does not trigger workflow runs -- that is GitHub's
      # recursion guard, and it applies to the `push: tags: [v*]` trigger in
      # release.yml. The two workflows looked connected and were not.
      #
      # This was not theoretical. Every historical release.yml run on this
      # repository failed, and the v0.4.0 release on 2026-10-03 had to be built
      # by hand via release.yml's `artifacts_only` dispatch input, because the
      # automatic path was known-broken and nobody could say why:
      #
      #   34996353889 workflow_dispatch  failure
      #   34932614680 workflow_dispatch  failure
      #   34789843685 workflow_dispatch  failure
      #   32817839477 push v0.4.0-rc.1   failure
      #   32801758551 push v0.4.0-rc.1   failure
      #
      # Note the last two: even a HAND-PUSHED tag failed, because those runs
      # predate this diagnosis, not because a human push works. Proved for
      # v0.4.0 on 2026-10-03: after auto-tag pushed the tag, the release
      # workflow reported total_count = 0 runs for that tag's SHA.
      #
      # The fix is to stop relying on the push as a trigger and DISPATCH the
      # release workflow explicitly. workflow_dispatch is not a push event, so
      # the recursion guard does not apply.
      #
      # NO LOOP IS POSSIBLE, and the guard is the `created=true` condition:
      #   - this step runs only when the tag did NOT already exist, so a
      #     re-run of auto-tag is a no-op and cannot re-dispatch;
      #   - release.yml does not create or push tags, so it cannot re-enter
      #     this workflow;
      #   - auto-tag is workflow_dispatch-only (its push trigger is commented
      #     out), so nothing triggers it automatically either.
      # `dispatch_release: false` lets an operator cut a tag deliberately
      # without starting a build.
      - name: Start the release pipeline for the new tag
        if: steps.create_tag.outputs.created == 'true' && inputs.dispatch_release == true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          gh workflow run release.yml --ref "$TAG"
          echo "Dispatched release.yml for $TAG."

      - name: Skip (tag already exists)
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          echo "v${{ steps.version.outputs.version }} already exists -- this Cargo.toml change didn't bump the version (e.g. a dependency update), nothing to do."
