name: Release Tagging Guard

# Release tags are an operator action. A Cargo.toml change can be ordinary
# development work and must never create a stable tag or trigger a release.
# The next intended tag is operator-created v0.4.0-alpha.1 after the version
# verifier and platform signing gates are satisfied.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tagging-is-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain release-tag policy
        run: |
          echo "Automatic tagging is disabled."
          echo "An operator must create v0.4.0-alpha.1 after release gates pass."
