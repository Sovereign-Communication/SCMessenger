name: Cross

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'HANDOFF/**'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'HANDOFF/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# SCOPE OF THIS WORKFLOW
# ----------------------
# This file used to also build the four Android ABIs, both iOS targets and the
# Kotlin/Swift bindings. Every one of those was a duplicate of a canonical job
# that stays: Android (4 ABIs) is built by "Android Debug APK" in mobile.yml
# (gradle buildRustAndroid compiles all four and verify_apk_native_libs.py checks
# them), iOS device+simulator by "iOS Build" in mobile.yml and ios-build-test.yml,
# and the Kotlin/Swift bindings by "FFI Surface Contract" in ci.yml. Nothing
# consumed the uploaded artifacts. What remains is the one lane with no other
# owner on pull requests: wasm32.
#
# The job always starts and completes green, so its check keeps reporting; its
# steps are skipped when detect-platform-change proves the diff cannot affect
# the Rust workspace (it fails open on anything it cannot classify).

jobs:
  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect Rust-relevant change
        id: platform
        uses: ./.github/actions/detect-platform-change
      - uses: dtolnay/rust-toolchain@1.99.0
        if: steps.platform.outputs.rust_relevant == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.platform.outputs.rust_relevant == 'true'
        with:
          key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build for wasm32-unknown-unknown
        if: steps.platform.outputs.rust_relevant == 'true'
        run: cargo build --target wasm32-unknown-unknown -p scmessenger-wasm --release
      - name: Upload artifacts
        if: steps.platform.outputs.rust_relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: target/wasm32-unknown-unknown/release/
