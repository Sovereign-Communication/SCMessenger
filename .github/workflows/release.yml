name: Multi-Platform Release Pipeline

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  verify-release-version:
    name: Verify release version metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify platform version and build-number agreement
        run: bash scripts/verify_versions.sh --require-tag

  # CLI Builds (Linux, macOS, Windows)
  build-cli:
    name: Build CLI - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: verify-release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: scmessenger-cli-linux-amd64
            asset_name: scm-linux-amd64
          - target: x86_64-apple-darwin
            os: macos-14
            artifact_name: scmessenger-cli-macos-amd64
            asset_name: scm-macos-amd64
          - target: aarch64-apple-darwin
            os: macos-14
            artifact_name: scmessenger-cli-macos-arm64
            asset_name: scm-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: scmessenger-cli-windows-amd64.exe
            asset_name: scm-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libssl-dev

      - name: Build Release
        run: cargo build --release --bin scmessenger-cli --target ${{ matrix.target }}

      - name: Prepare Asset (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/scmessenger-cli ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}

      - name: Prepare Asset (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/scmessenger-cli.exe ${{ matrix.asset_name }}

      - name: Generate Checksum
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-14" ]; then
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          else
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  # Android Release Build
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    needs: verify-release-version
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Require Android release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SCMESSENGER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SCMESSENGER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SCMESSENGER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SCMESSENGER_KEY_PASSWORD }}
        run: |
          for required in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!required}" ]; then
              echo "::error::Android release signing secret ${required} is not configured"
              exit 1
            fi
          done

      - name: Decode release keystore
        run: |
          echo "${{ secrets.SCMESSENGER_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build signed release AAB + APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          SCMESSENGER_KEYSTORE_PATH: release.keystore
          SCMESSENGER_KEYSTORE_PASSWORD: ${{ secrets.SCMESSENGER_KEYSTORE_PASSWORD }}
          SCMESSENGER_KEY_ALIAS: ${{ secrets.SCMESSENGER_KEY_ALIAS }}
          SCMESSENGER_KEY_PASSWORD: ${{ secrets.SCMESSENGER_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/release.keystore

      - name: Require non-empty signed release artifacts
        run: |
          test -n "$(find android/app/build/outputs/bundle/release -type f -name '*.aab' -size +0c -print -quit)"
          test -n "$(find android/app/build/outputs/apk/release -type f -name '*.apk' -size +0c -print -quit)"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-signed
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk

  # WASM Release Build
  build-wasm:
    name: Build WASM Release
    runs-on: ubuntu-latest
    needs: verify-release-version
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install wasm-opt
        run: |
          wget https://github.com/WebAssembly/binaryen/releases/download/version_116/binaryen-version_116-x86_64-linux.tar.gz
          tar -xzf binaryen-version_116-x86_64-linux.tar.gz
          sudo cp binaryen-version_116/bin/wasm-opt /usr/local/bin/

      - name: Build WASM
        run: |
          cd wasm
          wasm-pack build --target web --release

      - name: Optimize WASM
        run: |
          cd wasm
          ORIG_SIZE=$(stat -c%s pkg/scmessenger_wasm_bg.wasm)
          wasm-opt -Oz pkg/scmessenger_wasm_bg.wasm -o pkg/scmessenger_wasm_bg.wasm
          echo "Original size: $ORIG_SIZE bytes"
          echo "Optimized size: $(stat -c%s pkg/scmessenger_wasm_bg.wasm) bytes"

      - name: Generate ES Module and UMD formats
        run: |
          cd wasm
          # Create UMD bundle
          cat > pkg/scmessenger_wasm.umd.js << 'EOF'
          (function (global, factory) {
            if (typeof define === "function" && define.amd) {
              define(["exports"], factory);
            } else if (typeof exports !== "undefined") {
              factory(exports);
            } else {
              var mod = { exports: {} };
              factory(mod.exports);
              global.scmessenger_wasm = mod.exports;
            }
          })(typeof globalThis !== "undefined" ? globalThis : typeof self !== "undefined" ? self : this, function (exports) {
            "use strict";
            // ES module content will be inserted here
            const esModule = require('./scmessenger_wasm.js');
            Object.keys(esModule).forEach(key => {
              exports[key] = esModule[key];
            });
          });
          EOF

      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-release
          path: wasm/pkg/*

  # Create GitHub Release
  # iOS distribution is intentionally absent: an IPA would require an archive,
  # export options, and distribution signing gates that this workflow does not
  # configure. iOS CI owns simulator verification separately.
  create-release:
    name: Create GitHub Release
    needs: [build-cli, build-android, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Generate Changelog
        run: |
          ./scripts/generate_changelog.sh
          cat CHANGELOG.md

      - name: Generate Combined Checksums
        run: |
          # Find all binary files (excluding checksums)
          find . -type f \( -name "scm-*" -o -name "*.apk" -o -name "*.aab" -o -name "*.wasm" \) ! -name "*.sha256" | while read file; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> SHA256SUMS.txt
            fi
          done
          echo "Generated checksums:"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/scm-*
            **/*.apk
            **/*.aab
            **/*.wasm
            **/*.js
            **/*.ts
            SHA256SUMS.txt
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
