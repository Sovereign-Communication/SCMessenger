name: Multi-Platform Release Pipeline

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      artifacts_only:
        description: Build checksummed candidate artifacts without creating a GitHub Release or requiring a tag
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-release-version:
    name: Verify release version metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify platform version and build-number agreement (tagged release)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.artifacts_only != true }}
        run: bash scripts/verify_versions.sh --require-tag

      - name: Verify platform version and build-number agreement (candidate artifacts)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.artifacts_only == true }}
        run: bash scripts/verify_versions.sh

  # CLI Builds (Linux, macOS, Windows)
  build-cli:
    name: Build CLI - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: verify-release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: scmessenger-cli-linux-amd64
            asset_name: scm-linux-amd64
          - target: x86_64-apple-darwin
            os: macos-14
            artifact_name: scmessenger-cli-macos-amd64
            asset_name: scm-macos-amd64
          - target: aarch64-apple-darwin
            os: macos-14
            artifact_name: scmessenger-cli-macos-arm64
            asset_name: scm-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: scmessenger-cli-windows-amd64.exe
            asset_name: scm-windows-amd64.exe

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libssl-dev

      - name: Build Release
        env:
          SCM_GIT_HASH: ${{ github.sha }}
          SCM_GIT_REF: ${{ github.ref_name }}
          SCM_BUILD_TIME: ${{ github.run_started_at }}
        run: cargo build --release --bin scmessenger-cli --target ${{ matrix.target }}

      - name: Prepare Asset (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/scmessenger-cli ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}

      - name: Prepare Asset (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/scmessenger-cli.exe ${{ matrix.asset_name }}

      - name: Generate Checksum
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-14" ]; then
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          else
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi

      - name: Write build provenance
        shell: bash
        run: |
          cat > ${{ matrix.asset_name }}.provenance <<EOF
          git_sha=${GITHUB_SHA}
          git_ref=${GITHUB_REF_NAME}
          version=$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -n 1)
          runner=${RUNNER_OS}
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
            ${{ matrix.asset_name }}.provenance

  # Android Release Build
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    needs: verify-release-version
    env:
      HAS_KEYSTORE: ${{ secrets.SCMESSENGER_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Debug APK (for CI verification)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          SCM_GIT_HASH: ${{ github.sha }}
          SCM_GIT_REF: ${{ github.ref_name }}
          SCM_BUILD_TIME: ${{ github.run_started_at }}
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify debug APK contains core native libraries
        run: |
          python scripts/test_verify_apk_native_libs.py
          python scripts/verify_apk_native_libs.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Write Android build provenance
        run: |
          cat > android-debug-apk.provenance <<EOF
          git_sha=${GITHUB_SHA}
          git_ref=${GITHUB_REF_NAME}
          version=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*'([^']+)'/\1/p" android/build.gradle | head -n 1)
          runner=${RUNNER_OS}
          EOF

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android-debug-apk.provenance

      # Signed release build: only runs once SCMESSENGER_KEYSTORE_BASE64 is
      # set as a repo secret (see docs/ANDROID_RELEASE_SIGNING.md for how to
      # generate the keystore and configure the four required secrets).
      # Uses the env-driven signing path in android/app/build.gradle
      # (SCMESSENGER_KEYSTORE_PATH/_PASSWORD/_ALIAS/_PASSWORD -- first
      # priority in its signingConfigs.release block), so nothing in the
      # gradle config itself needs to change. Produces both a .aab (for
      # Play Store upload) and a signed .apk (for direct/sideload
      # distribution, e.g. handing a build straight to an alpha tester
      # without waiting on a Play Store review).
      - name: Decode release keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.SCMESSENGER_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          echo "${{ secrets.SCMESSENGER_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore

      - name: Build signed release AAB + APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          SCMESSENGER_KEYSTORE_PATH: release.keystore
          SCMESSENGER_KEYSTORE_PASSWORD: ${{ secrets.SCMESSENGER_KEYSTORE_PASSWORD }}
          SCMESSENGER_KEY_ALIAS: ${{ secrets.SCMESSENGER_KEY_ALIAS }}
          SCMESSENGER_KEY_PASSWORD: ${{ secrets.SCMESSENGER_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/release.keystore android/release.keystore

      - name: Require non-empty signed release artifacts
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          test -n "$(find android/app/build/outputs/bundle/release -type f -name '*.aab' -size +0c -print -quit)"
          test -n "$(find android/app/build/outputs/apk/release -type f -name '*.apk' -size +0c -print -quit)"

      - name: Verify release APK contains core native libraries
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          python scripts/test_verify_apk_native_libs.py
          APKS=$(find android/app/build/outputs/apk/release -type f -name '*.apk')
          if [ -z "$APKS" ]; then
            echo "[FAIL] no release APK found under android/app/build/outputs/apk/release"
            exit 1
          fi
          for apk in $APKS; do
            python scripts/verify_apk_native_libs.py "$apk" || exit 1
          done

      - name: Verify release APK signature
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            APKSIGNER=$(command -v apksigner || true)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner tool not found in ANDROID_HOME or PATH"
            exit 1
          fi
          echo "[INFO] Using apksigner: $APKSIGNER"

          APK_PATH=$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::No release APK found in android/app/build/outputs/apk/release"
            exit 1
          fi
          echo "[INFO] Verifying APK signature: $APK_PATH"

          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_PATH")
          echo "$CERT_OUTPUT"

          if echo "$CERT_OUTPUT" | grep -qi "Android Debug"; then
            echo "::error::APK is signed with a debug certificate (CN=Android Debug) instead of a release key!"
            exit 1
          fi

          SHA256_FINGERPRINT=$(echo "$CERT_OUTPUT" | grep -i "SHA-256 digest" | head -n 1 | awk '{print $NF}')
          if [ -z "$SHA256_FINGERPRINT" ]; then
            echo "::error::Failed to extract SHA-256 certificate digest from APK signature verification"
            exit 1
          fi
          echo "[INFO] Verified Release APK Certificate SHA-256: $SHA256_FINGERPRINT"

      - name: Upload signed release artifacts
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-release-signed
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk

  # iOS distribution is intentionally not part of this artifact workflow.
  # The repository has no CocoaPods project or Podfile, and production IPA
  # signing/export requires Apple credentials that are not configured here.
  # The dedicated iOS Build & Test workflow is the authoritative simulator
  # and XCTest gate; it passed for this candidate before artifact dispatch.

      # Note: Release signing requires GitHub Secrets
      # Uncomment and configure secrets for production releases
      # - name: Import Certificates
      #   env:
      #     CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      #     CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      #     PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      #   run: |
      #     # Import certificate to keychain
      #     echo "$CERTIFICATE_BASE64" | base64 -d > certificate.p12
      #     security create-keychain -p "" build.keychain
      #     security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
      #     # Install provisioning profile
      #     echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > profile.mobileprovision
      #     mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
      #     cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      #
      # - name: Build IPA
      #   run: |
      #     cd iOS
      #     xcodebuild -workspace SCMessenger.xcworkspace \
      #       -scheme SCMessenger \
      #       -configuration Release \
      #       -archivePath build/SCMessenger.xcarchive \
      #       archive
      #     xcodebuild -exportArchive \
      #       -archivePath build/SCMessenger.xcarchive \
      #       -exportPath build \
      #       -exportOptionsPlist ExportOptions.plist

  # WASM Release Build
  build-wasm:
    name: Build WASM Release
    runs-on: ubuntu-latest
    needs: verify-release-version
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install wasm-opt
        run: |
          wget https://github.com/WebAssembly/binaryen/releases/download/version_116/binaryen-version_116-x86_64-linux.tar.gz
          tar -xzf binaryen-version_116-x86_64-linux.tar.gz
          sudo cp binaryen-version_116/bin/wasm-opt /usr/local/bin/

      - name: Build WASM
        run: |
          cd wasm
          wasm-pack build --target web --release

      - name: Optimize WASM
        run: |
          cd wasm
          ORIG_SIZE=$(stat -c%s pkg/scmessenger_wasm_bg.wasm)
          # Rust/wasm-bindgen emits these standard WebAssembly features. Binaryen's
          # optimizer otherwise rejects the module during validation instead of
          # preserving the feature declarations.
          wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int \
            pkg/scmessenger_wasm_bg.wasm -o pkg/scmessenger_wasm_bg.wasm
          echo "Original size: $ORIG_SIZE bytes"
          echo "Optimized size: $(stat -c%s pkg/scmessenger_wasm_bg.wasm) bytes"

      - name: Generate ES Module and UMD formats
        run: |
          cd wasm
          # Create UMD bundle
          cat > pkg/scmessenger_wasm.umd.js << 'EOF'
          (function (global, factory) {
            if (typeof define === "function" && define.amd) {
              define(["exports"], factory);
            } else if (typeof exports !== "undefined") {
              factory(exports);
            } else {
              var mod = { exports: {} };
              factory(mod.exports);
              global.scmessenger_wasm = mod.exports;
            }
          })(typeof globalThis !== "undefined" ? globalThis : typeof self !== "undefined" ? self : this, function (exports) {
            "use strict";
            // ES module content will be inserted here
            const esModule = require('./scmessenger_wasm.js');
            Object.keys(esModule).forEach(key => {
              exports[key] = esModule[key];
            });
          });
          EOF

      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-release
          path: wasm/pkg/*

  # Create GitHub Release
  # iOS distribution is intentionally absent: an IPA would require an archive,
  # export options, and distribution signing gates that this workflow does not
  # configure. iOS CI owns simulator verification separately.
  create-release:
    name: Create GitHub Release
    needs: [build-cli, build-android, build-wasm]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.artifacts_only != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Generate Changelog
        run: |
          ./scripts/generate_changelog.sh
          cat CHANGELOG.md

      - name: Generate Combined Checksums
        run: |
          # Find all binary files (excluding checksums)
          find . -type f \( -name "scm-*" -o -name "*.apk" -o -name "*.aab" -o -name "*.wasm" \) ! -name "*.sha256" | while read file; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> SHA256SUMS.txt
            fi
          done
          echo "Generated checksums:"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/scm-*
            **/*.apk
            **/*.aab
            **/*.wasm
            **/*.js
            **/*.ts
            SHA256SUMS.txt
          body_path: CHANGELOG.md
          # Pre-release tags (alpha/beta/rc) create DRAFT releases. A GitHub
          # release is public the moment it exists, and the operator ruling
          # (CTO_STATE 0-2026-08-23d) locks pre-release builds behind draft
          # status: publishing gates on the external audit being commissioned
          # plus the four-node gate passing. Only final version tags publish.
          draft: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
