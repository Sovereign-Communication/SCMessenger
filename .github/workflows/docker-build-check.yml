name: Docker Build Check

# Build-only check of the production docker/Dockerfile on pull requests.
# docker-publish.yml only builds on push to main, so a Dockerfile break
# (e.g. a bad COPY path for a vendored crate) was previously caught only
# after merge. This job never logs in and never pushes. It is intentionally
# NOT a required check.

on:
  pull_request:
    paths:
      - 'docker/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vendor/**'
      - 'core/Cargo.toml'
      - 'core/build.rs'
      - 'core/src/**'
      - 'cli/Cargo.toml'
      - 'cli/build.rs'
      - 'cli/src/**'
      - 'mobile/Cargo.toml'
      - 'mobile/build.rs'
      - 'mobile/src/**'
      - 'wasm/Cargo.toml'
      - 'wasm/src/**'
      - 'desktop_bridge/Cargo.toml'
      - 'desktop_bridge/build.rs'
      - 'desktop_bridge/src/**'
      - '.github/workflows/docker-build-check.yml'

permissions:
  contents: read

concurrency:
  group: docker-build-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker Build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker/Dockerfile (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=docker-build-check
          cache-to: type=gha,scope=docker-build-check,mode=max
