# TEMPORARY probe workflow (branch-local, never merged).
#
# Purpose: prove the self-hosted OCI ARM64 runners (oci-a1-phx-1/2) are alive
# and carry every toolchain component the real CI jobs assume, BEFORE any repo
# variable is flipped and before main's routing is touched.
#
# It targets ["self-hosted","oci"] directly rather than through vars.CI_RUNNER,
# so it is completely independent of the CI_RUNNER/USE_OCI_RUNNER switches and
# cannot be silently redirected to a hosted runner.
#
# Delete this file once the routing change is verified.
name: OCI Runner Probe

on:
  push:
    branches: [ci/oci-runner-reenable-20261014]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: OCI host health probe
    runs-on: ["self-hosted", "oci"]
    timeout-minutes: 10
    steps:
      - name: Identify the runner
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME:-<unset>}"
          echo "RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-<unset>}"
          echo "arch=$(uname -m)"
          echo "kernel=$(uname -r)"
          echo "os=$(. /etc/os-release 2>/dev/null && echo "$PRETTY_NAME" || echo unknown)"
          echo "cpus=$(nproc)"
          echo "mem=$(free -h | awk '/^Mem:/{print $2}')"
          echo "cargo_home=${CARGO_HOME:-<unset>}"

      - name: Disk headroom
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE" || true
          echo "--- /tmp ---"
          df -h /tmp || true

      - name: Toolchain (the linux-build-deps verify-only contract)
        shell: bash
        run: |
          set -euo pipefail
          missing=()

          # Rust toolchain pinned at 1.99.0 by the repo.
          rustc --version 2>/dev/null || missing+=("rustc")
          cargo --version 2>/dev/null || missing+=("cargo")
          cargo clippy --version >/dev/null 2>&1 || missing+=("clippy")
          cargo fmt --version >/dev/null 2>&1 || missing+=("rustfmt")
          rustc_version="$(rustc --version 2>/dev/null || true)"
          case "$rustc_version" in
            "rustc 1.99.0 "*) echo "[OK] rustc 1.99.0" ;;
            *) missing+=("rustc-1.99.0 (got: ${rustc_version:-none})") ;;
          esac

          # Native build dependencies.
          command -v pkg-config >/dev/null 2>&1 || missing+=("pkg-config")
          pkg-config --exists dbus-1 || missing+=("libdbus-1-dev")
          command -v protoc >/dev/null 2>&1 || missing+=("protobuf-compiler")
          command -v rg >/dev/null 2>&1 || missing+=("ripgrep")

          # Base tooling the required checks use.
          command -v git >/dev/null 2>&1 || missing+=("git")
          command -v python3 >/dev/null 2>&1 || missing+=("python3")

          # The OCI host is deliberately not allowed sudo; confirm that still holds
          # so linux-build-deps' verify-only branch stays correct.
          if sudo -n true 2>/dev/null; then
            echo "[INFO] passwordless sudo IS available"
          else
            echo "[INFO] no passwordless sudo (matches linux-build-deps verify-only design)"
          fi

          if [ "${#missing[@]}" -ne 0 ]; then
            echo "[FAIL] missing on ${RUNNER_NAME:-this runner}: ${missing[*]}"
            exit 1
          fi
          echo "[OK] all probe requirements present on ${RUNNER_NAME:-runner}"

      - name: Protoc and dbus versions
        shell: bash
        run: |
          set -euo pipefail
          protoc --version || true
          pkg-config --modversion dbus-1 || true
          rg --version | head -1 || true

      # scripts/check_required_contexts.py (run by the required check
      # "Repository Hygiene Checks") needs a REAL YAML parser: PyYAML when
      # importable, else `yq`, else it hard-fails. If the OCI host has neither,
      # routing that required check here would make main unmergeable, so this is
      # the single most important thing to verify before flipping the variable.
      - name: YAML parser available for check_required_contexts.py
        shell: bash
        run: |
          set -euo pipefail
          py_yaml=no
          if python3 -c 'import yaml' 2>/dev/null; then py_yaml=yes; fi
          echo "PyYAML importable: $py_yaml"
          yq_present=no
          if command -v yq >/dev/null 2>&1; then yq_present=yes; fi
          echo "yq on PATH: $yq_present"
          if [ "$py_yaml" = "no" ] && [ "$yq_present" = "no" ]; then
            echo "[FAIL] neither PyYAML nor yq: check_required_contexts.py would hard-fail here"
            exit 1
          fi
          echo "[OK] a real YAML parser is available"

      # The gates that hygiene-checks and lint.yml run are pure python3; prove
      # the interpreter can actually import the stdlib modules they use.
      - name: Python stdlib modules used by the required gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, subprocess, sys, tempfile, itertools, pathlib, shutil, argparse
          print("python", sys.version.split()[0])
          print("[OK] stdlib imports used by the required gates are present")
          PY

      - name: Workspace cache state
        shell: bash
        run: |
          set -euo pipefail
          echo "workspace=$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE" | head -20 || true
          if [ -d "$GITHUB_WORKSPACE/target" ]; then
            echo "[INFO] target/ present"
            du -sh "$GITHUB_WORKSPACE/target" 2>/dev/null || true
          else
            echo "[INFO] no target/ (cold workspace)"
          fi
