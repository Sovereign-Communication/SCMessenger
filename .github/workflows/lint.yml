name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust Linting
    runs-on: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.USE_OCI_RUNNER != 'false' && fromJSON('["self-hosted","oci"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Detect docs-only change
        id: docs_only
        uses: ./.github/actions/detect-docs-only

      - name: Use preinstalled Rust (self-hosted)
        uses: ./.github/actions/self-hosted-rust
      - uses: dtolnay/rust-toolchain@1.99.0
        if: steps.docs_only.outputs.is_docs_only != 'true' && runner.environment != 'self-hosted'
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      
      - uses: Swatinem/rust-cache@v2
        if: steps.docs_only.outputs.is_docs_only != 'true'
        with:
          key: lint-rust-${{ hashFiles('**/Cargo.lock') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install libdbus-1-dev (Ubuntu)
        if: steps.docs_only.outputs.is_docs_only != 'true'
        uses: ./.github/actions/linux-build-deps
        with:
          ripgrep: 'true'

      - name: Check Rust formatting
        if: steps.docs_only.outputs.is_docs_only != 'true'
        run: cargo fmt --all -- --check
      
      - name: Run Clippy
        if: steps.docs_only.outputs.is_docs_only != 'true'
        run: cargo clippy --workspace -- -D warnings -A clippy::empty_line_after_doc_comments

      # Blocking, not informational: no continue-on-error. Catches the class
      # of bug behind the historical sender-impersonation hole (a real input
      # silently discarded via `_name` in RatchetSession::init_as_*_hybrid).
      # `unused_variables` (even at deny) cannot see this -- a leading
      # underscore is rustc's own sanctioned way to silence that lint, so it
      # needs a dedicated, AST-light scan. See the script's module docstring
      # for the full rationale and the exact empirical proof.
      - name: Check for ignored parameters in the merge-blocked perimeter
        run: python3 scripts/check_perimeter_underscore_params.py

      # Pure python3 (no ripgrep: it is absent on GitHub-hosted runners, which
      # made the old rg-based greps silently pass). Strips #[cfg(test)] items,
      # #[test] fns and test/bench/example paths before matching. Exceptions:
      # scripts/prod_unwrap_allowlist.cfg (file:line + reason). The gate FAILS
      # if python3 is missing or the script cannot run.
      - name: Check for unwrap() and println! in production library code
        if: steps.docs_only.outputs.is_docs_only != 'true'
        run: |
          command -v python3 >/dev/null 2>&1 || { echo "[FAIL] python3 missing; cannot run unwrap/println gate"; exit 1; }
          python3 -m unittest scripts/test_check_prod_unwrap_println.py
          python3 scripts/check_prod_unwrap_println.py

      - name: Clean self-hosted workspace
        if: always()
        uses: ./.github/actions/self-hosted-cleanup

  kotlin:
    name: Kotlin Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Detect docs-only change
        id: docs_only
        uses: ./.github/actions/detect-docs-only

      - name: Setup Android SDK
        if: steps.docs_only.outputs.is_docs_only != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      
      - name: Cache Gradle dependencies
        if: steps.docs_only.outputs.is_docs_only != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Run ktlint
        if: steps.docs_only.outputs.is_docs_only != 'true'
        run: |
          cd android
          ./gradlew ktlintCheck

  swift:
    name: Swift Linting
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # WHY THERE IS ONLY ONE DETECTION STEP HERE
      # ----------------------------------------
      # detect-platform-change's inert set IS detect-docs-only's set (both use
      # '^docs/|^HANDOFF/|\.md$'), so a docs-only diff reports
      # ios_relevant=false by construction: the platform gate subsumes the
      # docs-only gate in this job, and one owner now decides whether these
      # steps run instead of two conditions that could drift apart. The job
      # itself always starts and completes green, so the check still reports.
      - name: Detect platform-relevant change
        id: platform
        uses: ./.github/actions/detect-platform-change

      - name: Install swiftlint
        if: steps.platform.outputs.ios_relevant == 'true'
        run: brew install swiftlint
      
      - name: Run swiftlint
        if: steps.platform.outputs.ios_relevant == 'true'
        run: |
          cd iOS
          swiftlint lint --strict

  javascript:
    name: JavaScript Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Detect docs-only change
        id: docs_only
        uses: ./.github/actions/detect-docs-only

      - uses: actions/setup-node@v4
        if: steps.docs_only.outputs.is_docs_only != 'true'
        with:
          node-version: '20'
      
      - name: Check if package.json exists
        id: check-package
        if: steps.docs_only.outputs.is_docs_only != 'true'
        run: |
          if [ -f "wasm/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No package.json found in wasm directory - skipping JavaScript linting"
          fi
      
      - name: Cache npm dependencies
        if: steps.check-package.outputs.exists == 'true' && steps.docs_only.outputs.is_docs_only != 'true'
        uses: actions/cache@v6
        with:
          path: wasm/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('wasm/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install dependencies
        if: steps.check-package.outputs.exists == 'true' && steps.docs_only.outputs.is_docs_only != 'true'
        run: |
          cd wasm
          npm install
      
      - name: Run eslint
        if: steps.check-package.outputs.exists == 'true' && steps.docs_only.outputs.is_docs_only != 'true'
        run: |
          cd wasm
          npm run lint
