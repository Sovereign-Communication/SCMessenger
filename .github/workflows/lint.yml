name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust_relevant: ${{ steps.platform.outputs.rust_relevant }}
      ios_relevant: ${{ steps.platform.outputs.ios_relevant }}
      kotlin_relevant: ${{ steps.platform.outputs.kotlin_relevant }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect platform-relevant change
        id: platform
        uses: ./.github/actions/detect-platform-change

  # Required context. Only the cheap, non-compiling checks live here: rustfmt and
  # the two python perimeter/unwrap gates. clippy (--all-features, a strict
  # superset of what ran here) is the canonical job "Lint" in ci.yml, so it is
  # not compiled a second time. Hosted: nothing here needs the OCI warm cache.
  rust:
    name: Rust Linting
    needs: changes
    # Required check: always run and fail closed if `changes` failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fail closed if change detection failed
        if: needs.changes.result != 'success'
        run: |
          echo "[FAIL] changes job result: ${{ needs.changes.result }}"
          exit 1
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.120.0
        if: needs.changes.outputs.rust_relevant == 'true'
        with:
          toolchain: 1.99.0
          components: rustfmt

      - name: Check Rust formatting
        if: needs.changes.outputs.rust_relevant == 'true'
        run: cargo fmt --all -- --check

      # Blocking, not informational: no continue-on-error. Catches the class
      # of bug behind the historical sender-impersonation hole (a real input
      # silently discarded via `_name` in RatchetSession::init_as_*_hybrid).
      # `unused_variables` (even at deny) cannot see this -- a leading
      # underscore is rustc's own sanctioned way to silence that lint, so it
      # needs a dedicated, AST-light scan. See the script's module docstring
      # for the full rationale and the exact empirical proof. Always runs.
      - name: Check for ignored parameters in the merge-blocked perimeter
        run: python3 scripts/check_perimeter_underscore_params.py

      # Pure python3 (no ripgrep: it is absent on GitHub-hosted runners, which
      # made the old rg-based greps silently pass). Strips #[cfg(test)] items,
      # #[test] fns and test/bench/example paths before matching. Exceptions:
      # scripts/prod_unwrap_allowlist.cfg (file:line + reason). The gate FAILS
      # if python3 is missing or the script cannot run.
      - name: Check for unwrap() and println! in production library code
        if: needs.changes.outputs.rust_relevant == 'true'
        run: |
          command -v python3 >/dev/null 2>&1 || { echo "[FAIL] python3 missing; cannot run unwrap/println gate"; exit 1; }
          python3 -m unittest scripts/test_check_prod_unwrap_println.py
          python3 scripts/check_prod_unwrap_println.py

  kotlin:
    name: Kotlin Linting
    needs: changes
    # Job-level skip: ktlint only reads android/, so it never starts for other diffs.
    if: needs.changes.outputs.kotlin_relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      
      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Run ktlint
        run: |
          cd android
          ./gradlew ktlintCheck

  swift:
    name: Swift Linting
    needs: changes
    # Job-level skip so a macOS runner (10x billing, scarce slots) is never acquired
    # for a diff that cannot affect Swift.
    if: needs.changes.outputs.ios_relevant == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install swiftlint
        run: brew install swiftlint
      
      - name: Run swiftlint
        run: |
          cd iOS
          swiftlint lint --strict

  javascript:
    name: JavaScript Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Detect docs-only change
        id: docs_only
        uses: ./.github/actions/detect-docs-only

      - uses: actions/setup-node@v4
        if: steps.docs_only.outputs.is_docs_only != 'true'
        with:
          node-version: '20'
      
      - name: Check if package.json exists
        id: check-package
        if: steps.docs_only.outputs.is_docs_only != 'true'
        run: |
          if [ -f "wasm/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No package.json found in wasm directory - skipping JavaScript linting"
          fi
      
      - name: Cache npm dependencies
        if: steps.check-package.outputs.exists == 'true' && steps.docs_only.outputs.is_docs_only != 'true'
        uses: actions/cache@v6
        with:
          path: wasm/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('wasm/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install dependencies
        if: steps.check-package.outputs.exists == 'true' && steps.docs_only.outputs.is_docs_only != 'true'
        run: |
          cd wasm
          npm install
      
      - name: Run eslint
        if: steps.check-package.outputs.exists == 'true' && steps.docs_only.outputs.is_docs_only != 'true'
        run: |
          cd wasm
          npm run lint
