plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
    id 'org.jlleitschuh.gradle.ktlint' version '12.1.0'
}

// Load keystore.properties if it exists (don't fail CI if it's missing, just fallback)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.canRead()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseSigningReady = {
    def envStoreFile = System.getenv("SCMESSENGER_KEYSTORE_PATH") ?: System.getenv("KEYSTORE_FILE")
    def envStorePass = System.getenv("SCMESSENGER_KEYSTORE_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
    def envKeyAlias = System.getenv("SCMESSENGER_KEY_ALIAS") ?: System.getenv("KEYSTORE_ALIAS")
    def envKeyPass = System.getenv("SCMESSENGER_KEY_PASSWORD") ?: System.getenv("KEY_PASSWORD")
    def environmentSigning = envStoreFile && envStorePass && envKeyAlias && envKeyPass && file(envStoreFile).isFile()
    def propertiesSigning = keystorePropertiesFile.canRead() &&
        ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every {
            keystoreProperties.containsKey(it) && keystoreProperties[it]?.toString()?.trim()
        } &&
        file(keystoreProperties['storeFile']).isFile()
    return environmentSigning || propertiesSigning
}()

def getGitHash = { ->
    def configuredHash = System.getenv('SCM_GIT_HASH')?.trim()
    if (configuredHash) {
        return configuredHash
    }

    def stdout = new ByteArrayOutputStream()
    try {
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }
        def result = stdout.toString().trim()
        return result.isEmpty() ? "unknown" : result
    } catch (Exception e) {
        return "unknown"
    }
}

def getGitRef = { ->
    def configuredRef = System.getenv('SCM_GIT_REF')?.trim()
    if (configuredRef) {
        return configuredRef
    }

    def stdout = new ByteArrayOutputStream()
    try {
        exec {
            commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
            standardOutput = stdout
        }
        def result = stdout.toString().trim()
        return result.isEmpty() ? "unknown" : result
    } catch (Exception e) {
        return "unknown"
    }
}

gradle.taskGraph.whenReady { graph ->
    // Source-set lint and test tasks also contain "Release" in their names.
    // Gate only tasks that can actually assemble, package, publish, or install
    // a release artifact.
    def releaseRequested = graph.allTasks.any {
        it.name ==~ /(?i)(assemble|bundle|package|publish|install)Release$/
    }
    if (releaseRequested && !releaseSigningReady) {
        throw new GradleException("Release signing is required. Configure a real release keystore; debug signing is never valid for release artifacts.")
    }
}

def getBuildTime = { ->
    def configuredTime = System.getenv('SCM_BUILD_TIME')?.trim()
    if (configuredTime) {
        return configuredTime
    }

    return new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone("UTC"))
}

android {
    namespace = 'com.scmessenger.android'
    compileSdk = rootProject.ext.compileSdk
    
    // Pinned NDK version for build reproducibility (Requirement 7.3)
    // NDK r26b (26.1.10909125) or NDK r30 (30.0.14904198)
    ndkVersion = '26.1.10909125'

    signingConfigs {
        release {
            // Priority order:
            //   1. SCMESSENGER_KEYSTORE_PATH / _PASSWORD / _ALIAS / _PASSWORD (env-driven)
            //   2. KEYSTORE_FILE / KEYSTORE_PASSWORD / KEYSTORE_ALIAS / KEY_PASSWORD (legacy)
            //   3. keystore.properties file (do not commit — see keystore.properties.template)
            def envStoreFile = System.getenv("SCMESSENGER_KEYSTORE_PATH") ?: System.getenv("KEYSTORE_FILE")
            def envStorePass = System.getenv("SCMESSENGER_KEYSTORE_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
            def envKeyAlias  = System.getenv("SCMESSENGER_KEY_ALIAS") ?: System.getenv("KEYSTORE_ALIAS")
            def envKeyPass   = System.getenv("SCMESSENGER_KEY_PASSWORD") ?: System.getenv("KEY_PASSWORD")

            if (envStoreFile != null && envStorePass != null && envKeyAlias != null && envKeyPass != null) {
                storeFile file(envStoreFile)
                storePassword envStorePass
                keyAlias envKeyAlias
                keyPassword envKeyPass
                println "Signing: Using SCMESSENGER_KEYSTORE_PATH (env-driven release signing)"
            } else if (keystorePropertiesFile.canRead() &&
                       keystoreProperties.containsKey('storeFile') &&
                       keystoreProperties.containsKey('storePassword') &&
                       keystoreProperties.containsKey('keyAlias') &&
                       keystoreProperties.containsKey('keyPassword')) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                println "Signing: Using keystore.properties (file-driven release signing)"
            } else {
                // Never substitute the debug key for a release artifact. AGP
                // will reject a release task with this incomplete config.
                println "Release signing is not configured; release tasks must fail."
            }
        }
    }
    
    defaultConfig {
        applicationId = 'com.scmessenger.android'
        minSdk = rootProject.ext.minSdk
        targetSdk = rootProject.ext.targetSdk
        versionCode = rootProject.ext.versionCode
        versionName = rootProject.ext.versionName
        
        buildConfigField "String", "SCM_GIT_HASH", "\"${getGitHash()}\""
        buildConfigField "String", "SCM_GIT_REF", "\"${getGitRef()}\""
        buildConfigField "String", "SCM_BUILD_TIME", "\"${getBuildTime()}\""
        
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        
        // Specify ABIs we're building for (devices and simulators)
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }
    }
    
    buildTypes {
        release {
            // Shrinking + obfuscation (R8). proguard-rules.pro contains the
            // keep-rules for UniFFI, Hilt, Compose, Serialization, etc.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
            // Hardening: do not allow debug build of release artifact.
            debuggable = false
            jniDebuggable = false
            // Keep native symbols at FULL so R8 does not strip stack traces
            // needed for crash deobfuscation (it does not change the APK
            // surface — symbols stay in the .so files).
            ndk {
                debugSymbolLevel = 'FULL'
            }
        }
        debug {
            minifyEnabled = false
            debuggable = true
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-opt-in=kotlin.RequiresOptIn',
            '-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
            '-opt-in=androidx.compose.material3.ExperimentalMaterial3Api'
        ]
    }
    
    // Kapt block removed in favor of KSP
    
    buildFeatures {
        compose = true
        buildConfig = true
    }
    
    composeOptions {
        kotlinCompilerExtensionVersion = rootProject.ext.compose_compiler_version
    }
    
    packaging {
        resources {
            excludes.add('/META-INF/{AL2.0,LGPL2.1}')
            excludes.add('META-INF/LICENSE.md')
            excludes.add('META-INF/LICENSE-notice.md')
            excludes.add('META-INF/LICENSE.txt')
            excludes.add('META-INF/NOTICE.txt')
        }
        
        // JNI libraries from Rust
        jniLibs {
            useLegacyPackaging = true
        }
    }
    
    sourceSets {
        main {
            // Include generated UniFFI Kotlin bindings
            // The UniFFI bindings are KOTLIN (uniffi/api/api.kt), so register
            // the directory on the Kotlin source set as well as the Java one.
            // java.srcDirs alone relies on the Kotlin plugin folding it in,
            // which is not a contract we should be depending on for the one
            // source file the whole Hilt graph needs to resolve.
            java.srcDirs += '../../core/target/generated-sources/uniffi/kotlin'
            kotlin.srcDirs += '../../core/target/generated-sources/uniffi/kotlin'

            // JNI libraries from cargo-ndk build
            jniLibs.srcDirs = ['../../core/target/android-libs']
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                // Fail fast on a hang instead of burning the whole CI job budget.
                // :app:testDebugUnitTest previously ran until the job timeout killed
                // it (90 min twice, 151 min once) while passing locally in 54s.
                timeout = java.time.Duration.ofMinutes(10)

                // Print each test as it STARTS. The cause of the container hang is
                // still unknown, and this is the diagnostic: the last "started" line
                // before the timeout names the test that blocks. Without it the log
                // ends mid-task with no indication of where.
                testLogging {
                    events 'started', 'passed', 'failed', 'skipped'
                    showStandardStreams = true
                    exceptionFormat = 'full'
                }
            }
        }
    }
}

