// Detect MSYS2/MinGW toolchain path for GNU builds on Windows.
// The GNU toolchain requires dlltool.exe on PATH, which lives in MSYS2.
def msysUcrtBin = file('C:/msys64/ucrt64/bin').exists() ? 'C:/msys64/ucrt64/bin' : null

// Read properties from local.properties if it exists
def localPropsFile = rootProject.file("local.properties")
def localProps = new Properties()
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

// Helper function to invoke cargo ndk for a target architecture.
// rustProfile is the caller's single source of truth and must be exactly
// "release" or "debug" -- never empty (see the command construction below).
def runCargoNdkBuild(String target, String sdkDir, String ndkDir, String rustProfile, boolean isWindows, String msysUcrtBin) {
    exec {
        workingDir project.file('../../')
        // Ensure 16KB page alignment for Android 15+ compatibility and lightweight debug info
        environment "RUSTFLAGS", "-C link-arg=-Wl,-z,max-page-size=16384 -C debuginfo=0"
        environment "CARGO_INCREMENTAL", "0"
        
        // Auto-detect and use sccache if available
        def sccacheExists = false
        def sccacheName = isWindows ? "sccache.exe" : "sccache"
        def pathEnv = System.getenv("PATH")
        if (pathEnv != null) {
            def separator = isWindows ? ";" : ":"
            sccacheExists = pathEnv.split(separator).any { pathDir ->
                if (pathDir.trim().isEmpty()) return false
                try {
                    return file("${pathDir}/${sccacheName}").exists()
                } catch (Exception e) {
                    return false
                }
            }
        }
        if (!sccacheExists && isWindows) {
            sccacheExists = file("C:/ProgramData/chocolatey/bin/sccache.exe").exists() ||
                            file("C:/Program Data/chocolatey/bin/sccache.exe").exists()
        }
        if (sccacheExists) {
            environment "RUSTC_WRAPPER", "sccache"
            println "sccache detected and configured as RUSTC_WRAPPER for $target"
        }

        // Check for incremental compilation toggle
        def cargoIncrementalVal = project.hasProperty('cargoIncremental') ? project.property('cargoIncremental').toString() : System.getenv('CARGO_INCREMENTAL')
        if (cargoIncrementalVal != null) {
            environment "CARGO_INCREMENTAL", cargoIncrementalVal
        }

        // Explicitly pass SDK and NDK paths to cargo-ndk
        environment "ANDROID_HOME", sdkDir
        environment "ANDROID_NDK_HOME", ndkDir

        // Keep the native core's build stamp aligned with the APK metadata.
        // CI and the Windows lane provide the exact anchor through these
        // variables; local builds fall back to the checkout in core/build.rs.
        ['SCM_GIT_HASH', 'SCM_GIT_REF', 'SCM_BUILD_TIME'].each { key ->
            def value = System.getenv(key)?.trim()
            if (value) {
                environment key, value
            }
        }

        if (isWindows && msysUcrtBin) {
            environment "PATH", "${msysUcrtBin};${System.getenv('PATH')}"
        }

        def cargoCmd = isWindows ? 'cargo' : (file("${System.getProperty('user.home')}/.cargo/bin/cargo").exists() ? "${System.getProperty('user.home')}/.cargo/bin/cargo" : 'cargo')
        // Map the profile token to cargo arguments WITHOUT an Elvis operator.
        // "release" -> pass --release (cargo writes target/<triple>/release/).
        // "debug"   -> pass NO profile flag (cargo's default dev profile writes
        //              target/<triple>/debug/, exactly where the copy step looks).
        // The old code did `rustProfile ?: '--release'`, and because Groovy
        // treats "" as falsy, every debug build was silently flipped to a
        // release build while the copy step kept looking in debug/, found
        // nothing, skipped, and assembleDebug still printed BUILD SUCCESSFUL
        // with zero libscmessenger_core.so in the APK. An empty or unknown
        // token is now rejected outright instead of reinterpreted.
        if (rustProfile != 'release' && rustProfile != 'debug') {
            throw new GradleException("runCargoNdkBuild: invalid rustProfile '${rustProfile}' (expected 'release' or 'debug')")
        }
        if (isWindows) {
            def profileFlag = rustProfile == 'release' ? ' --release' : ''
            commandLine 'cmd', '/c', "cargo ndk -t $target build${profileFlag} -p scmessenger-core"
        } else {
            def cmd = [cargoCmd, 'ndk', '-t', target, 'build']
            if (rustProfile == 'release') {
                cmd << '--release'
            }
            cmd.addAll(['-p', 'scmessenger-core'])
            commandLine cmd
        }
    }
}

def abiFilterProp = project.findProperty('abiFilters') ?: System.getenv('ANDROID_ABI_FILTERS')
def abiFilterList = abiFilterProp ? abiFilterProp.split(',').collect { it.trim() } : null

def targetList = [
    [name: 'Arm64', target: 'aarch64-linux-android', abi: 'arm64-v8a'],
    [name: 'Armv7', target: 'armv7-linux-androideabi', abi: 'armeabi-v7a'],
    [name: 'X86_64', target: 'x86_64-linux-android', abi: 'x86_64'],
    [name: 'X86', target: 'i686-linux-android', abi: 'x86']
].findAll { arch -> abiFilterList == null || abiFilterList.contains(arch.abi) }

targetList.each { arch ->
    task "buildRustAndroid${arch.name}" {
        description = "Build Rust library for ${arch.target} using cargo-ndk"
        group = 'rust'

        inputs.dir('../../core/src')
        inputs.file('../../core/Cargo.toml')

        doLast {
            def sdkDir = localProps.getProperty('sdk.dir') ?: System.getenv('ANDROID_SDK_ROOT') ?: System.getenv('ANDROID_HOME') ?: android.sdkDirectory.absolutePath
            def ndkDir = localProps.getProperty('ndk.dir') ?: System.getenv('ANDROID_NDK_HOME') ?: System.getenv('ANDROID_NDK_ROOT') ?: android.ndkDirectory?.absolutePath
            if (ndkDir == null || !file(ndkDir).exists()) {
                ndkDir = "${sdkDir}/ndk/${android.ndkVersion}"
            }
            if (!file(ndkDir).exists()) {
                throw new GradleException("Could not find NDK version ${android.ndkVersion} at $ndkDir.")
            }
            
            def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
            def taskNames = project.gradle.startParameter.taskNames.join(",")
            def isRelease = taskNames.contains("Release") || taskNames.contains("Bundle")

            // Single source of truth for the cargo profile. The token names BOTH
            // the profile to build and the target/<triple>/<dir> cargo writes:
            // "release" -> --release -> release/, "debug" -> default dev profile
            // -> debug/. It can never be empty -- the previous code passed "" for
            // debug builds, which the helper's Elvis fallback flipped to a release
            // build, while the copy below kept looking in debug/ and skipped, so
            // assembleDebug uploaded APKs without libscmessenger_core.so that
            // still printed BUILD SUCCESSFUL.
            def rustProfile = isRelease ? "release" : "debug"
            def rustDir = rustProfile

            println "Starting buildRustAndroid${arch.name} task (Profile: ${rustProfile})..."
            println "Using NDK: $ndkDir"

            runCargoNdkBuild(arch.target, sdkDir, ndkDir, rustProfile, isWindows, msysUcrtBin)

            // Copy output to destination. A missing .so here means the APK would
            // build green and crash on launch with UnsatisfiedLinkError, so this
            // step FAILS LOUDLY instead of skipping silently (same contract as the
            // generateUniFFIBindings step-5 assertion below). A build that cannot
            // start must not pass.
            def sourceFile = file("../../target/${arch.target}/${rustDir}/libscmessenger_core.so")
            def destDir = file("../../core/target/android-libs/${arch.abi}")
            if (!sourceFile.exists()) {
                def tripleDir = file("../../target/${arch.target}")
                def lines = []
                if (tripleDir.exists()) {
                    tripleDir.listFiles()?.sort { it.name }?.each { entry ->
                        lines << "    ${entry.name}${entry.isDirectory() ? '/' : ''}"
                        if (entry.isDirectory() && entry.name in ['debug', 'release']) {
                            entry.listFiles()?.sort { it.name }?.each { sub ->
                                lines << "        ${sub.name}${sub.isDirectory() ? '/' : ''}"
                            }
                        }
                    }
                } else {
                    lines << "    (${tripleDir} does not exist)"
                }
                def listing = lines ? lines.join('\n') : "    (empty)"
                throw new GradleException(
                    "Rust native library for ${arch.abi} (${arch.target}) was not produced; " +
                    "refusing to package an APK that cannot start.\n" +
                    "  expected: ${sourceFile}\n" +
                    "  profile:  ${rustProfile}\n" +
                    "  contents of target/${arch.target} (debug/ and release/ expanded):\n${listing}"
                )
            }
            destDir.mkdirs()
            copy {
                from sourceFile
                into destDir
            }
        }
    }
}

task buildRustAndroid {
    description = 'Aggregated task to build target architectures in parallel'
    group = 'rust'
    dependsOn targetList.collect { "buildRustAndroid${it.name}" }
}


// Task to generate UniFFI Kotlin bindings
//
// Lifecycle (the order MATTERS — see comment on each step):
//   1. cargo build -p scmessenger-core (host target) → cdylib for binding gen
//   2. STAGE the cdylib to a stable path outside the cargo target dir, so
//      step 3's cargo invocation (which re-compiles scmessenger-core with the
//      gen-bindings feature) cannot invalidate or move it
//   3. cargo build -p scmessenger-core --bin gen_kotlin --features gen-bindings
//      → produces the gen_kotlin binary at a known path
//   4. Run the gen_kotlin binary directly with the staged cdylib path passed
//      via env var, so its hardcoded relative-path search is bypassed
task generateUniFFIBindings {
    description = 'Generate bindings using custom binary from core crate'
    group = 'rust'

    // Inputs relative to project dir
    inputs.dir('../../core/src')
    inputs.file('../../core/Cargo.toml')
    outputs.dir('../../core/target/generated-sources/uniffi/kotlin')

    doFirst {
        file('../../core/target/generated-sources/uniffi/kotlin').mkdirs()
    }

    doLast {
        def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
        def isLinux = System.getProperty('os.name').toLowerCase().contains('linux')
        def isMac = System.getProperty('os.name').toLowerCase().contains('mac')

        // Resolve the host cdylib name
        def cdylibName = isWindows ? 'scmessenger_core.dll' : (isMac ? 'libscmessenger_core.dylib' : 'libscmessenger_core.so')

        def cargoCmd = isWindows ? 'cargo' : (file("${System.getProperty('user.home')}/.cargo/bin/cargo").exists() ? "${System.getProperty('user.home')}/.cargo/bin/cargo" : 'cargo')

        // Step 1: build the host cdylib.
        //
        // MUST stay a DEBUG build. uniffi library-mode bindgen recovers the
        // interface by reading UNIFFI metadata symbols out of the compiled
        // cdylib. A release build strips/GCs those symbols, so bindgen finds no
        // metadata, emits nothing, and still exits 0 -- generation "succeeds"
        // and produces an empty output tree.
        //
        // ebf5411b flipped this to `--release ... -C debuginfo=0` and the Mobile
        // lane went from green (feb89335, 2026-08-13) to red on the very next
        // run. The symptom surfaced a minute later and two tasks downstream as
        // `e: [ksp] ... error.NonExistentClass` on AndroidPlatformBridge's
        // supertype, which sent two rounds of diagnosis after task ordering and
        // source-set registration. Neither was the cause. Step 5 below now
        // fails here instead, at the real site.
        exec {
            workingDir project.file('../../')
            environment "RUSTFLAGS", ""
            environment "CARGO_INCREMENTAL", "0"
            ['SCM_GIT_HASH', 'SCM_GIT_REF', 'SCM_BUILD_TIME'].each { key ->
                def value = System.getenv(key)?.trim()
                if (value) {
                    environment key, value
                }
            }
            if (isWindows) {
                commandLine 'cmd', '/c', 'cargo build -p scmessenger-core'
            } else {
                commandLine cargoCmd, 'build', '-p', 'scmessenger-core'
            }
        }

        // Step 2: stage the cdylib to a stable location outside cargo's target
        // dir. This survives subsequent cargo invocations that re-compile
        // scmessenger-core with different feature flags (which can otherwise
        // delete or move the cdylib in the incremental target dir).
        def cargoTargetDirStr = System.getenv('CARGO_TARGET_DIR') ?: '../../target'
        def cargoTargetDir = project.file(cargoTargetDirStr)
        def stagedDir = file('../../core/target/staged-cdylib')
        stagedDir.mkdirs()
        def cdylibSrc = new File(cargoTargetDir, "debug/${cdylibName}")
        def cdylibStaged = new File(stagedDir, cdylibName)
        if (cdylibSrc.exists()) {
            ant.copy(file: cdylibSrc.absolutePath, tofile: cdylibStaged.absolutePath, overwrite: true)
            println "Staged cdylib: ${cdylibStaged.absolutePath}"
        } else {
            throw new GradleException("cdylib not found at ${cdylibSrc.absolutePath} after cargo build")
        }

        // Step 3: build (do NOT run) the gen_kotlin binary
        exec {
            workingDir project.file('../../core')
            environment "RUSTFLAGS", "-C debuginfo=0"
            environment "CARGO_INCREMENTAL", "0"
            ['SCM_GIT_HASH', 'SCM_GIT_REF', 'SCM_BUILD_TIME'].each { key ->
                def value = System.getenv(key)?.trim()
                if (value) {
                    environment key, value
                }
            }
            if (isWindows) {
                commandLine 'cmd', '/c', 'cargo build --bin gen_kotlin --features gen-bindings'
            } else {
                commandLine cargoCmd, 'build', '--bin', 'gen_kotlin', '--features', 'gen-bindings'
            }
        }

        // Step 4: invoke the gen_kotlin binary directly with the staged cdylib
        // path. The binary now also honours SCMESSENGER_CDYLIB_PATH env var as
        // a primary lookup, falling back to CARGO_TARGET_DIR + relative paths.
        def genKotlinBin = new File(cargoTargetDir, "debug/gen_kotlin${isWindows ? '.exe' : ''}")
        if (!genKotlinBin.exists()) {
            throw new GradleException("gen_kotlin binary not found at ${genKotlinBin.absolutePath}")
        }
        exec {
            workingDir project.file('../../core')
            environment "CARGO_MANIFEST_DIR", project.file('../../core').absolutePath
            environment "SCMESSENGER_CDYLIB_PATH", cdylibStaged.absolutePath
            environment "CARGO_INCREMENTAL", "0"
            if (isWindows) {
                commandLine 'cmd', '/c', genKotlinBin.absolutePath
            } else {
                commandLine genKotlinBin.absolutePath
            }
        }

        // Step 5: prove the bindings actually landed.
        //
        // Without this the task "succeeds" whether or not it produced anything,
        // and the only symptom is a KSP error 60 seconds later complaining that
        // an unrelated supertype is error.NonExistentClass. That failure mode
        // cost a full diagnosis cycle on 2026-08-15 because the log gave no
        // evidence either way about whether api.kt existed.
        def apiKt = file('../../core/target/generated-sources/uniffi/kotlin/uniffi/api/api.kt')
        if (!apiKt.isFile() || apiKt.length() == 0) {
            def root = file('../../core/target/generated-sources')
            def listing = root.exists()
                ? root.traverse(maxDepth: 4).collect { "    ${it}" }.join('\n')
                : "    (${root} does not exist)"
            throw new GradleException(
                "UniFFI generation produced no usable bindings.\n" +
                "  expected: ${apiKt}\n" +
                "  exists:   ${apiKt.isFile()}, size: ${apiKt.isFile() ? apiKt.length() : 0}\n" +
                "  tree under core/target/generated-sources:\n${listing}"
            )
        }
        println "UniFFI bindings OK: ${apiKt} (${apiKt.length()} bytes)"
    }
}


// Ensure tasks run before build
afterEvaluate {
    // Hook into preBuild
    tasks.named("preBuild").configure {
        dependsOn buildRustAndroid
        dependsOn generateUniFFIBindings
    }

    // KSP must not run before the UniFFI bindings exist.
    //
    // AndroidPlatformBridge implements `uniffi.api.PlatformBridge`, which is
    // GENERATED by generateUniFFIBindings into core/target/. Hilt's KSP
    // processor has to resolve that supertype to build the injection graph.
    //
    // Depending on preBuild is NOT sufficient under AGP 8: kspDebugKotlin is
    // not ordered behind preBuild's dependencies, so on a cold checkout (CI,
    // or any tree where core/target/ has been cleaned) KSP runs first, the
    // supertype resolves to error.NonExistentClass, and the build fails with:
    //
    //   e: [ksp] InjectProcessingStep was unable to process
    //      'AndroidPlatformBridge(...)' because 'error.NonExistentClass'
    //      could not be resolved.
    //
    // This passes locally on a warm tree and fails only in CI, which is why it
    // survived: the generated api.kt is gitignored, so nothing verifies it.
    // Matching by task name rather than KspTask.class keeps this working across
    // KSP plugin versions without a buildscript classpath import.
    tasks.matching {
        it.name.startsWith("ksp") && it.name.endsWith("Kotlin")
    }.configureEach {
        dependsOn generateUniFFIBindings
    }
}


// ktlint configuration
ktlint {
    version = "1.0.1"
    android = true
    ignoreFailures = true
    reporters {
        reporter "plain"
        reporter "checkstyle"
    }
    filter {
        exclude("**/generated/**")
        exclude("**/build/**")
    }
}
